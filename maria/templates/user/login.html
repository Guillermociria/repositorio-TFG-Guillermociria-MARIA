{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 60vh;
}
.auth-card {
    background: white;
    border-radius: 10px;
    padding: 40px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08);
}
.auth-card h2 {
    margin-bottom: 28px;
    color: var(--tertiary);
    font-size: 22px;
}
.form-group {
    margin-bottom: 18px;
}
.form-group label {
    display: block;
    margin-bottom: 6px;
    font-weight: 500;
    color: var(--dark);
    font-size: 14px;
}
.form-group input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
}
.form-group input:focus {
    border-color: var(--primary);
}
.btn-full {
    width: 100%;
    padding: 12px;
    font-size: 15px;
    margin-top: 8px;
}
.auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #666;
}
.auth-footer a {
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
}
.errorlist {
    color: #c0392b;
    font-size: 13px;
    margin-top: 4px;
    padding-left: 16px;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Iniciar sesión</h2>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Usuario</label>
                <input type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="form-group">
                <label for="id_password">Contraseña</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            {% if form.errors %}
            <ul class="errorlist">
                <li>Usuario o contraseña incorrectos.</li>
            </ul>
            {% endif %}
            <button type="submit" class="btn btn-full">Entrar</button>
        </form>
        <div class="auth-footer">
            ¿No tienes cuenta? <a href="{% url 'register' %}">Regístrate</a>
        </div>
    </div>
</div>
{% endblock %}
